# Параметрический tACS
# tASC работает как симметричный биполярный синус
# SIN - базовый тип
# amplitude_mA - Амплитуда, mA
# frequency_hz - Частота, Гц 
# fade_in_sec - Время плавного нарастания, сек
# fade_out_sec - Время плавного спада, сек

dsl_version: 1
name: "tACS"
type: "SIN"

channels:
  mode: "left"

feedback:
  # Итоговая оценка амплитуды: base_value * amp_estimation_coeff
  amp_estimation_base: "STD"
  # Для синуса: A = sqrt(2) * STD
  amp_estimation_coeff: 1.414

scope:
  # Для SIN: two_periods | no_sync
  sync_mode: "two_periods"

params:
  # menu_label: "Амплитуда, мА"
  # screen_label: "Ампл., мА"
  amplitude_mA:
    min: 0.1
    max: 3.0
    step: 0.1  # шаг настройки амплитуды, mA
    default: 1.0

  # menu_label: "Частота, Гц"
  # screen_label: "Част., Гц"
  frequency_hz:
    min: 100.0
    max: 1000.0
    step: 0.1
    default: 140.0

  # menu_label: "Плавный старт, с"
  # screen_label: "Старт, с"
  fade_in_sec:
    min: 0
    max: 60
    step: 1
    default: 10

  # menu_label: "Плавный стоп, с"
  # screen_label: "Стоп, с"
  fade_out_sec:
    min: 0
    max: 60
    step: 1
    default: 10

  # menu_label: "Длительность, мин"
  # screen_label: "Длит., мин"
  duration_min:
    min: 2
    max: 60
    step: 1
    default: 20

sample_rate_hz: # служебный параметр генератора; в UI не настраивается
  value: 8000