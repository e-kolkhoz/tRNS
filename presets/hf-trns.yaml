# Высокочастотный tRNS 100-640 на базе WAV
# Гауссовский шум, квазибелый в дипапазоне 100-640 Гц симметричный униполярный
dsl_version: 1
name: "hf-tRNS"
type: "WAV"

channels:
  mode: "left"

feedback:
  # Crest factor левого канала WAV считается при загрузке пресета
  amp_estimation_base: "AUTO_RMS"

scope:
  # Для WAV обычно один период лупа
  sync_mode: "one_period"

# WAV должен лежать рядом на флешке
wave_file: "hf-tRNS.wav"

params:
  # menu_label: "Амплитуда, мА"
  # screen_label: "Ампл., мА"
  amplitude_mA:
    min: 0.1
    max: 2.0
    step: 0.1
    default: 1.0

  # menu_label: "Плавный старт, с"
  # screen_label: "Старт, с"
  fade_in_sec:
    min: 0
    max: 60
    step: 1
    default: 10

  # menu_label: "Плавный стоп, с"
  # screen_label: "Стоп, с"
  fade_out_sec:
    min: 0
    max: 60
    step: 1
    default: 10

  # menu_label: "Длительность, мин"
  # screen_label: "Длит., мин"
  duration_min:
    min: 2
    max: 60
    step: 1
    default: 20
