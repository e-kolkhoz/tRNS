# Двуханодный tDCS с дефолтной амплитудой 1.0 mA
dsl_version: 1
name: "tDCS-2A"
type: "CONST"

channels:
  # двуханодный режим tDCS стимуляции
  mode: "both"

feedback:
  # для CONST имеет смысл только MEAN
  amp_estimation_base: "MEAN"
  # для постоянного сигнала коэффициент не нужен, оставляем 1.0 для единообразия DSL
  amp_estimation_coeff: 1.0

params:
  # menu_label: "Амплитуда, мА"
  # screen_label: "Ампл., мА"
  amplitude_mA:
    min: 0.1
    max: 2.0
    step: 0.1
    default: 1.0

  # menu_label: "Плавный старт, с"
  # screen_label: "Старт, с"
  fade_in_sec:
    min: 0
    max: 60
    step: 1
    default: 10

  # menu_label: "Плавный стоп, с"
  # screen_label: "Стоп, с"
  fade_out_sec:
    min: 0
    max: 60
    step: 1
    default: 10

sample_rate_hz: # частота дискретизации
  value: 8000